# PenguinTech standard git hooks.
#
# Install:  make install-hooks
# Run all:  pre-commit run --all-files
#
# Two stages, matching devops.md "Git Hooks (Mandatory)":
#   pre-commit — fast checks only (<30s), blocks the commit
#   pre-push   — heavier security scans, blocks the push
#
# Revs are pinned. Update deliberately via `pre-commit autoupdate` or Renovate,
# never by floating to a branch.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ── Hygiene ────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm/manager templates use Go or Jinja placeholders — not
        # parseable as standalone YAML (k8s/helm/*/templates,
        # apps/manager/templates/statefulset, etc.).
        exclude: (^|/)templates/.*\.ya?ml$
      - id: check-json
      - id: check-executables-have-shebangs
      - id: detect-private-key

  # ── Secrets (mandatory, every repo) ────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Shell (Bash must stay 3.2-compatible — see general.md) ─────────────────
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # ── Python — ruff ONLY, never alongside flake8/black/isort ─────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy --ignore-missing-imports
        language: system
        types: [python]

  # ── Go ─────────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout=5m
        language: system
        types: [go]
        pass_filenames: false

  # ── Node/TypeScript (web/ + shared/node_libs/) ──────────────────────────────
  - repo: local
    hooks:
      - id: eslint-web
        name: eslint (web)
        entry: bash -c 'cd web && npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0'
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: prettier-web
        name: prettier (web)
        entry: bash -c 'cd web && npx prettier --check .'
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|json|css|md)$
        pass_filenames: false
      - id: eslint-node-libs
        name: eslint (shared/node_libs)
        entry: bash -c 'cd shared/node_libs && npx eslint src --ext .ts'
        language: system
        files: ^shared/node_libs/src/.*\.ts$
        pass_filenames: false
      - id: prettier-node-libs
        name: prettier (shared/node_libs)
        entry: bash -c 'cd shared/node_libs && npx prettier --check "src/**/*.ts"'
        language: system
        files: ^shared/node_libs/src/.*\.ts$
        pass_filenames: false

  # ── Rust (pkg/sdk/rust/) ─────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (rust SDK)
        entry: bash -c 'cd pkg/sdk/rust && cargo fmt --check'
        language: system
        files: ^pkg/sdk/rust/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (rust SDK)
        entry: bash -c 'cd pkg/sdk/rust && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^pkg/sdk/rust/.*\.rs$
        pass_filenames: false
        stages: [pre-push]

  # ── Dockerfiles ────────────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
        # Default hook matches any file under .github/workflows/ — this repo
        # also keeps a non-workflow .ansible-lint config in that directory.
        files: ^\.github/workflows/.*\.ya?ml$

  # ── Security (pre-push — heavier, keeps commits fast) ──────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-push]

  - repo: local
    hooks:
      - id: govulncheck
        name: govulncheck
        entry: bash -c 'go run golang.org/x/vuln/cmd/govulncheck@v1.1.3 ./...'
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-audit
        name: cargo audit (rust SDK)
        entry: bash -c 'cd pkg/sdk/rust && cargo audit'
        language: system
        files: ^pkg/sdk/rust/.*
        pass_filenames: false
        stages: [pre-push]
      - id: dockerfile-rootless
        name: Dockerfile runs as non-root
        entry: scripts/hooks/check-dockerfile-rootless.sh
        language: script
        files: (^|/)Dockerfile[^/]*$
        stages: [pre-push]

[alembic]
# Path to the migration scripts directory, relative to this file
script_location = migrations

# DB URL is set programmatically in env.py from the DB_URI environment variable.
# The placeholder here is overridden at runtime — do not store real credentials.
sqlalchemy.url = postgresql://nest:nest@localhost:5432/nest

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

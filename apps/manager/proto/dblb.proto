syntax = "proto3";
package dblb;
option go_package = "github.com/penguintechinc/marchproxy/proxy-dblb/proto";

// ModuleService matches the Go interface defined in proxy-dblb/internal/grpc/server.go.
// Methods: GetStatus, Reload, Shutdown, GetMetrics, HealthCheck, GetStats.
service ModuleService {
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc GetStats(StatsRequest) returns (StatsResponse);
}

message StatusRequest {}
message StatusResponse {
  string status = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  int32 active_connections = 4;
  int32 backend_count = 5;
}

message ReloadRequest {
  bool force = 1;
}
message ReloadResponse {
  bool success = 1;
  string message = 2;
  int32 routes_loaded = 3;
}

message ShutdownRequest {
  bool graceful = 1;
}
message ShutdownResponse {
  bool success = 1;
  string message = 2;
}

message MetricsRequest {}
message MetricsResponse {
  string prometheus_text = 1;
}

message HealthCheckRequest {}
message HealthCheckResponse {
  bool healthy = 1;
  string status = 2;
}

message StatsRequest {}
message StatsResponse {
  int64 total_requests = 1;
  int64 total_errors = 2;
  double avg_latency_ms = 3;
  map<string, int64> requests_by_protocol = 4;
}

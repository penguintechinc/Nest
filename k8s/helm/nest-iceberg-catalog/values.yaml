replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/nest/iceberg-catalog
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8181

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  ADDR: ":8181"
  LOG_LEVEL: "info"

# Postgres backend connection (for persistent catalog metadata)
postgresql:
  enabled: false
  uri: ""

serviceAccount:
  create: true
  name: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /healthz
    port: 8181
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    port: 8181
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

nodeSelector: {}
affinity: {}
tolerations: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Rook-Ceph cluster, block pool, filesystem and StorageClasses — Helm
# equivalent of k8s/kustomize/base/{nest-rbd,nest-cephfs}. Requires the
# Rook-Ceph operator to already be installed (out of scope for this chart).
namespace: rook-ceph

cephCluster:
  image:
    repository: quay.io/ceph/ceph
    tag: "v19.2.0"
    # External image — SHA256 digest pinning is mandatory in ALL environments.
    digest: "sha256:200087c35811bf28e8a8073b15fa86c07cce85c575f1ccd62d1d6ddbfdc6770a"
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
  mgr:
    count: 2
  nodeSelector:
    key: nest.penguintech.io/role
    values:
      - storage

blockPool:
  name: nest-rbd-pool
  failureDomain: host
  size: 3
  minSize: "2"
  requireSafeReplicaSize: true

filesystem:
  name: nest-cephfs
  failureDomain: host
  metadataReplicaSize: 3
  metadataMinSize: "2"
  dataReplicaSize: 3
  dataMinSize: "2"
  preservePoolsOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

storageClasses:
  block:
    name: nest-block
    default: true
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
  filesystem:
    name: nest-fs
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
  filesystemRWO:
    name: nest-fs-rwo
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer

kms:
  enabled: true
  provider: skauswatch
  endpoint: http://skauswatch:8080

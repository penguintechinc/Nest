kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 15d
      scrapeInterval: 15s
      externalLabels:
        cluster: nest
      additionalScrapeConfigs:
        - job_name: nest-gateway
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app]
              action: keep
              regex: nest-gateway
  alertmanager:
    alertmanagerSpec:
      retention: 120h
  grafana:
    enabled: false
  prometheusOperator:
    enabled: true

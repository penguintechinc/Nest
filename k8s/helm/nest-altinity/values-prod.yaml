altinity-clickhouse-operator:
  # NOTE: upstream chart does not support multi-replica HA for the operator
  # controller; production HA is achieved via resource headroom + PDB is not
  # exposed by this chart either. Metrics/serviceMonitor enabled for alerting.
  operator:
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  metrics:
    enabled: true

  serviceMonitor:
    enabled: true

apiVersion: v1
kind: Service
metadata:
  name: {{ include "nest-injector.fullname" . }}
  labels:
    {{- include "nest-injector.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: nest-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP

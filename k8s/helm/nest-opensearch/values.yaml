opensearch-operator:
  # Operator replica configuration
  replicaCount: 1

  # Operator image configuration. NOTE: the previous repository name
  # (opensearch-k8s-operator) and tag (2.4.0) do not exist upstream — the
  # correct public.ecr.aws repository is `opensearch-operator`, and 2.4.0
  # was never published there. Bumped to the nearest available release.
  # External image — SHA256 digest pinning is mandatory in ALL environments.
  image:
    repository: public.ecr.aws/opensearchproject/opensearch-operator
    tag: "2.5.1"
    digest: "sha256:c92a908aef728a4be6237c65dc582586636a3df2877da1acdd740c02688c8ef7"
    pullPolicy: IfNotPresent

  # RBAC configuration
  rbac:
    create: true

  # Service account configuration
  serviceAccount:
    create: true
    name: opensearch-operator

  # Operator manager pod resource limits and requests
  manager:
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # Logging configuration
  logLevel: info

  # Watch specific namespaces (empty = all namespaces)
  watchNamespaces: ""

  # Monitoring
  monitoring:
    enabled: true
    metricsPort: 8080

  # Webhook configuration
  webhook:
    enabled: true
    port: 9443

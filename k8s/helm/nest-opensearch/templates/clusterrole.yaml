{{- if (index .Values "opensearch-operator" "rbac" "create") -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nest-opensearch.fullname" . }}
  labels:
    {{- include "nest-opensearch.labels" . | nindent 4 }}
rules:
- apiGroups: ["opensearch.opster.io"]
  resources: ["opensearchclusters", "opensearchclusters/status", "opensearchclusters/finalizers"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets", "serviceaccounts"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["*"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["nest.penguintech.io"]
  resources: ["dataresources", "dataresources/status"]
  verbs: ["get", "list", "watch", "update", "patch"]
{{- end }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-api
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Client traffic reaches nest-api via the shared Gateway API Gateway
    # (see .Values.ingressNamespace) or from other pods within the `nest`
    # namespace — never a blanket cross-namespace allow.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingressNamespace }}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Arbitrary external HTTPS egress (license.penguintech.io, multi-cloud
    # provider APIs — DO/Vultr/Linode/S3-compat). Destination IPs are not
    # stable enough to enumerate; restricted to port 443 only.
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-dblb
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-gateway
      ports:
        - protocol: TCP
          port: 50051
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.kubeSystemNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-controller
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Arbitrary external HTTPS egress (license.penguintech.io, multi-cloud
    # provider APIs — DO/Vultr/Linode/S3-compat). Destination IPs are not
    # stable enough to enumerate; restricted to port 443 only.
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.kubeSystemNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server access (controller reconciliation loop). The
    # apiserver's ClusterIP/endpoint isn't a stable, selectable namespace
    # target, so this is restricted to port 6443 only, no other ports.
    - ports:
        - protocol: TCP
          port: 6443
---

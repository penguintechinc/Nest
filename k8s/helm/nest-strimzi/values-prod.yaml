strimzi-kafka-operator:
  # High availability: multiple replicas (upstream key: `replicas`)
  replicas: 2

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Production: info logging (debug is too verbose for prod)
  logLevel: INFO

  # Production: pod disruption budget for high availability
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

strimzi-kafka-operator:
  # Watch all namespaces for Kafka resources
  watchAnyNamespace: true
  watchNamespaces: []

  # Cluster operator replica count (upstream key: `replicas`, not `replicaCount`)
  replicas: 1

  # Operator image (upstream schema: registry/repository/name/tag/digest; no
  # pullPolicy key exposed). External image — SHA256 digest pinning is
  # mandatory in ALL environments; the chart uses `digest` over `tag` when set.
  image:
    registry: quay.io
    repository: strimzi
    name: operator
    tag: "0.40.0"
    digest: "sha256:2228d89b53e3524e69d1bcf5c2cd373884ce696d9005389a6c78dad23310e837"

  # RBAC / ServiceAccount (upstream keys: rbac.create, serviceAccountCreate, serviceAccount <string>)
  rbac:
    create: true
  serviceAccountCreate: true
  serviceAccount: strimzi-cluster-operator

  # Resource limits and requests (upstream: top-level `resources` key)
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Logging configuration (upstream: top-level `logLevel` key)
  logLevel: INFO

  # Pod disruption budget (upstream: top-level `podDisruptionBudget` key)
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # NOTE: the upstream strimzi-kafka-operator chart does not expose a
  # `webhook` or `monitoring.metricsPort` values key — the cluster operator
  # has no admission webhook and metrics are scraped via the operator's
  # built-in Prometheus endpoint (enabled via the `metrics` ConfigMap, not values).

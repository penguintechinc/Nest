apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nest-gateway.fullname" . }}
  labels:
    app: nest-gateway
    app.kubernetes.io/name: nest-gateway
    app.kubernetes.io/part-of: nest
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: nest-gateway
  template:
    metadata:
      labels:
        app: nest-gateway
        app.kubernetes.io/name: nest-gateway
        app.kubernetes.io/part-of: nest
    spec:
      serviceAccountName: nest-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: nest-gateway
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --grpc-addr=:50052
        - --http-addr=:8082
        ports:
        - name: grpc
          containerPort: 50052
          protocol: TCP
        - name: http
          containerPort: 8082
          protocol: TCP
        env:
        {{- range $key, $val := .Values.env }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-gateway
  labels:
    app: nest-gateway
    app.kubernetes.io/part-of: nest

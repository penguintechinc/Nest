# Route external S3 traffic into the Rook-Ceph RGW pods.
# The Service name follows the Rook naming convention: rook-ceph-rgw-{store}.
apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-rgw-{{ .Values.objectStore.name }}
  namespace: {{ .Values.objectStore.namespace }}
  labels:
    app: rook-ceph-rgw
    rgw: {{ .Values.objectStore.name }}
    {{- include "nest-rgw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: rook-ceph-rgw
    rgw: {{ .Values.objectStore.name }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP

replicaCount: 1

image:
  repository: ghcr.io/ferretdb/ferretdb
  tag: "1.24.0"
  # External image — SHA256 digest pinning is mandatory in ALL environments.
  digest: "sha256:e4e442895ae2aaf8284db3d012c8d0e1c84d6f353d16678a0d3edf6d7e81d624"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 27017

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

postgresql:
  # Connection string to the backing PostgreSQL cluster
  # Override per-tenant with: postgres://{user}:{password}@{host}:5432/{db}
  uri: ""

telemetry:
  enabled: false

serviceAccount:
  create: true
  name: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    port: 27017
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    port: 27017
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

nodeSelector: {}
affinity: {}
tolerations: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

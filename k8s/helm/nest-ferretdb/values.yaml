replicaCount: 1

image:
  repository: ghcr.io/ferretdb/ferretdb
  tag: "1.24.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 27017

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

postgresql:
  # Connection string to the backing PostgreSQL cluster
  # Override per-tenant with: postgres://{user}:{password}@{host}:5432/{db}
  uri: ""

telemetry:
  enabled: false

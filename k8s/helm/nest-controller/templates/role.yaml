{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nest-controller.fullname" . }}
  labels:
    {{- include "nest-controller.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  resourceNames: ["nest-controller-leader"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["nest.penguintech.io"]
  resources: ["hardwareinventories"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["nest.penguintech.io"]
  resources: ["hardwareinventories/status"]
  verbs: ["get", "update", "patch"]
{{- end }}

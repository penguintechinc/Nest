image:
  repository: ghcr.io/penguintechinc/nest/nest-controller
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

xdp:
  enabled: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

env:
  GIN_MODE: release
  PORT: "8080"
  LOG_LEVEL: warn
  LEADER_ELECTION_ENABLED: "true"
  LEADER_ELECTION_NAMESPACE: "nest"

probes:
  liveness:
    path: /healthz
    port: 8081
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    port: 8081
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  create: true
  name: nest-controller

configMap:
  create: true
  name: nest-controller-config

rbac:
  create: true

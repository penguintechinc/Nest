{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nest-scheduler.fullname" . }}
  labels:
    {{- include "nest-scheduler.labels" . | nindent 4 }}
rules:
- apiGroups: ["nest.penguintech.io"]
  resources: ["dataresources"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["nest.penguintech.io"]
  resources: ["dataresources/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["nest.penguintech.io"]
  resources: ["dataresourceclasses", "hardwarepools", "schedulingpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes", "events"]
  verbs: ["get", "list", "watch", "create", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}

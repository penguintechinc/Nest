image:
  repository: ghcr.io/penguintechinc/nest/nest-api
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

xdp:
  enabled: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

env:
  GIN_MODE: release
  PORT: "8080"
  LOG_LEVEL: warn

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  create: true
  name: nest-api

configMap:
  create: true
  name: nest-api-config

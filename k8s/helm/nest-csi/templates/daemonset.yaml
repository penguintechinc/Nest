apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nest-csi.fullname" . }}-node
  labels:
    {{- include "nest-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-plugin
spec:
  selector:
    matchLabels:
      {{- include "nest-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-plugin
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "nest-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-plugin
    spec:
      serviceAccountName: {{ include "nest-csi.serviceAccountName" . }}
      hostPID: false
      hostNetwork: false
      # securityContext exception (approved): CSI node plugin — pod-level identity
      # matches the privileged container below (root is required for host
      # mount/unmount syscalls); explicit here so this isn't left at the (also
      # root-allowing) Kubernetes default.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
      - name: node-plugin
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - "--node"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CSI_ENDPOINT
          value: {{ .Values.env.CSI_ENDPOINT }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # securityContext exception (approved): CSI node plugin — privileged mode
        # required for host bind-mount/unmount syscalls; see values.yaml.
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: {{ .Values.probes.liveness.port }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
        - name: kubelet-dir
          mountPath: /var/lib/kubelet/
          mountPropagation: Bidirectional
        - name: registration-dir
          mountPath: /registration
      volumes:
      - name: socket-dir
        hostPath:
          path: /var/lib/kubelet/plugins/csi.nest.penguintech.io/
          type: DirectoryOrCreate
      - name: kubelet-dir
        hostPath:
          path: /var/lib/kubelet/
          type: Directory
      # Plugin registration dir (kubelet's node-driver-registrar handshake path),
      # not the entire host root. driver.NodeStageVolume/NodePublishVolume are
      # currently unimplemented (P2 feature, see services/csi/driver/driver.go) and
      # nothing in the codebase reads/writes outside /var/lib/kubelet today; add a
      # /dev hostPath mount here only when block-device staging is implemented.
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry/
          type: DirectoryOrCreate
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

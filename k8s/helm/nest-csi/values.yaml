image:
  repository: ghcr.io/penguintechinc/nest/nest-csi
  tag: latest
  pullPolicy: IfNotPresent

csi:
  # CSI node plugin runs on every node
  nodePlugin:
    enabled: true
  # CSI controller runs as deployment (not included in this chart, separate StatefulSet)
  controller:
    enabled: false

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

env:
  LOG_LEVEL: warn
  CSI_ENDPOINT: "unix:///csi/csi.sock"
  NODE_NAME: ""  # Injected at runtime

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# securityContext exception (approved): CSI node plugin — privileged mode is
# required for host mount/unmount syscalls (bind mounts into kubelet's pod
# volume directories). Kept minimal: only "privileged" is set, applied at the
# container level (see templates/daemonset.yaml); no additional capabilities
# are added beyond what "privileged" already implies.
securityContext:
  privileged: true
  allowPrivilegeEscalation: true
  runAsUser: 0
  runAsNonRoot: false

nodeSelector: {}

tolerations:
  - operator: Exists

affinity: {}

serviceAccount:
  create: true
  name: nest-csi

configMap:
  create: true
  name: nest-csi-config

rbac:
  create: true

cephfs:
  enabled: true
  clusterID: rook-ceph
  fsName: nest-cephfs
  pool: nest-cephfs-data0

rook:
  rbdSocket: "unix:///var/lib/kubelet/plugins/rook-ceph.rbd.csi.ceph.com/csi.sock"
  cephfsSocket: "unix:///var/lib/kubelet/plugins/rook-ceph.cephfs.csi.ceph.com/csi.sock"

{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nest-node-agent.fullname" . }}
  labels:
    {{- include "nest-node-agent.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: ["nest.penguintech.io"]
  resources: ["hardwareinventories"]
  verbs: ["create", "update", "patch"]
{{- end }}

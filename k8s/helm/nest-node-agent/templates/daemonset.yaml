apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nest-node-agent.fullname" . }}
  labels:
    {{- include "nest-node-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nest-node-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "nest-node-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nest-node-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      hostPID: false
      hostNetwork: false
      containers:
      - name: {{ .Chart.Name }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # securityContext exception (approved): node-agent is a hardware/SMART
        # monitoring agent. SYS_RAWIO is required for SG_IO/ATA passthrough ioctls
        # used to read SMART data from block devices; no code path in
        # services/node-agent writes to /dev, /sys, or /run/udev (see readOnly
        # mounts below), so the capability is scoped to read-only diagnostics.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - SYS_RAWIO
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: {{ .Values.probes.liveness.port }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        envFrom:
        - configMapRef:
            name: {{ include "nest-node-agent.fullname" . }}-config
        volumeMounts:
        - name: dev
          mountPath: /dev
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: run-udev
          mountPath: /run/udev
          readOnly: true
      volumes:
      - name: dev
        hostPath:
          path: /dev
      - name: sys
        hostPath:
          path: /sys
      - name: run-udev
        hostPath:
          path: /run/udev
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

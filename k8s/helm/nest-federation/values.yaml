replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/nest/federation-controller
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9095

env:
  FEDERATION_CLUSTERS: ""
  ENTERPRISE_LICENSE: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

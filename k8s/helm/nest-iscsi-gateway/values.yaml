image:
  repository: ghcr.io/penguintechinc/nest/nest-iscsi-gateway
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

env:
  GIN_MODE: release
  PORT: "8083"
  LOG_LEVEL: warn
  CEPH_ISCSI_ENDPOINT: "http://localhost:5000"

probes:
  liveness:
    path: /health
    port: 8083
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    port: 8083
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  create: true
  name: nest-iscsi-gateway

configMap:
  create: true
  name: nest-iscsi-gateway-config

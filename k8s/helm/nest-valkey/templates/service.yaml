apiVersion: v1
kind: Service
metadata:
  name: {{ include "nest-valkey.fullname" . }}
  labels:
    {{- include "nest-valkey.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "ClusterIP" }}
  clusterIP: None
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    {{- include "nest-valkey.selectorLabels" . | nindent 4 }}

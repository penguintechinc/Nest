image:
  repository: docker.io/valkey/valkey
  tag: "8-bookworm"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

storage:
  enabled: true
  size: 1Gi
  storageClass: nest-rbd
  accessMode: ReadWriteOnce
  volumeName: ""

# Valkey configuration
config:
  # Default maxmemory (80% of memory limit ~ 410MB)
  maxmemory: "410mb"
  maxmemoryPolicy: allkeys-lru
  # Persistence
  savePolicy: ""
  # TCP keepalive
  tcpKeepalive: 300
  # Timeout for idle clients
  timeout: 0

# Service configuration
service:
  type: ClusterIP
  port: 6379
  targetPort: 6379
  annotations: {}

# Persistence configuration
persistence:
  enabled: true
  type: rbd
  rbd:
    monitors:
    - ceph-mon.ceph:6789
    pool: rbd
    image: valkey
    user: ceph
    keyringPath: /etc/ceph/ceph.client.ceph.keyring

# Health checks
healthCheck:
  enabled: true
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999

# Node selector and affinity
nodeSelector: {}
affinity: {}
tolerations: []

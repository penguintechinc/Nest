replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

storage:
  enabled: true
  size: 10Gi
  storageClass: nest-rbd

config:
  maxmemory: "820mb"
  maxmemoryPolicy: allkeys-lru
  tcpKeepalive: 300
  timeout: 0

# Production: full health checks
healthCheck:
  enabled: true
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Production: full persistence with RBD
persistence:
  enabled: true
  type: rbd
  rbd:
    monitors:
    - ceph-mon.ceph:6789
    pool: rbd
    image: valkey-prod
    user: ceph
    keyringPath: /etc/ceph/ceph.client.ceph.keyring

# Production: affinity for HA
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - nest-valkey
        topologyKey: kubernetes.io/hostname

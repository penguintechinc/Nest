cloudnative-pg:
  replicaCount: 1

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Production: info logging (debug is too verbose for prod)
  logLevel: info

  # Production: full monitoring enabled
  monitoring:
    enabled: true
    prometheusRule:
      enabled: true

  # Production: ensure webhook is properly configured
  webhook:
    enabled: true
    port: 9443
    failurePolicy: Fail

exampleCluster:
  instances: 3
  storage:
    size: 100Gi
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  backup:
    retentionPolicy: "90d"

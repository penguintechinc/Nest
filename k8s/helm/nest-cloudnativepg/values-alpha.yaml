cloudnative-pg:
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Alpha: minimal logging
  logLevel: info

  # Alpha: disable additional monitoring features
  monitoring:
    enabled: false
    prometheusRule:
      enabled: false

# Alpha: single-instance example cluster, no scheduled backups
exampleCluster:
  instances: 1
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  backup:
    enabled: false

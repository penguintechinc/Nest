apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-api
  namespace: nest
  labels:
    app: nest-api
    app.kubernetes.io/name: nest-api
    app.kubernetes.io/part-of: nest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-api
  template:
    metadata:
      labels:
        app: nest-api
        app.kubernetes.io/name: nest-api
        app.kubernetes.io/part-of: nest
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: nest-api
          image: nest-api
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: nest-config
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false

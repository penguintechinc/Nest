apiVersion: v1
kind: Service
metadata:
  name: nest-api
  namespace: nest
  labels:
    app: nest-api
    app.kubernetes.io/name: nest-api
    app.kubernetes.io/part-of: nest
spec:
  type: ClusterIP
  selector:
    app: nest-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

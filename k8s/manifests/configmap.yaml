apiVersion: v1
kind: ConfigMap
metadata:
  name: nest-config
data:
  LOG_LEVEL: "INFO"
  RELEASE_MODE: "false"
  ENVIRONMENT: "production"
  # Standard DB_* env vars (Python manager / multi-DB support)
  DB_TYPE: "postgresql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "nest"
  DB_USER: "nest"
  DB_PASS: "nestpass"
  # POSTGRES_* env vars (Go API / postgres.go)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "nest"
  POSTGRES_USER: "nest"
  POSTGRES_PASSWORD: "nestpass"
  POSTGRES_SSLMODE: "disable"

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-controller
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - ports:
        - protocol: TCP
          port: 443

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-controller
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Arbitrary external HTTPS egress (license.penguintech.io, multi-cloud
    # provider APIs — DO/Vultr/Linode/S3-compat). Destination IPs are not
    # stable enough to enumerate; restricted to port 443 only.
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server access (controller reconciliation loop). The
    # apiserver's ClusterIP/endpoint isn't a stable, selectable namespace
    # target, so this is restricted to port 6443 only, no other ports.
    - ports:
        - protocol: TCP
          port: 6443

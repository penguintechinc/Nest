apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-db-proxy
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-db-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # nest-api and nest-manager may reach the proxy's per-protocol data-plane
    # listeners (mysql 5432 / postgresql 5433 / redis 5434 container ports).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-manager
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5433
        - protocol: TCP
          port: 5434
    # nest-manager drives the gRPC ConfigService control plane.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-manager
      ports:
        - protocol: TCP
          port: 50051
    # Prometheus scrape.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Backend database pods (CNPG/MariaDB/MySQL clusters) run in the same
    # `nest` namespace on varying per-tenant ports — same-namespace-only
    # (not cluster-wide) is the practical minimum; no port restriction
    # since tenant DB ports are dynamic.
    - to:
        - podSelector: {}
    # Redis/Valkey config bus (routes/security/cache) + result cache.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-dblb
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-dblb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only nest-api may reach the database proxy (least privilege — no
    # blanket cross-namespace allow).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-api
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Backend database pods (CNPG/MariaDB/MySQL clusters) run in the same
    # `nest` namespace on varying per-tenant ports — same-namespace-only
    # (not cluster-wide) is the practical minimum; no port restriction
    # since tenant DB ports are dynamic.
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

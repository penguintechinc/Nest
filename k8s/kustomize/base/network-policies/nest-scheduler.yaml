apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-scheduler
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-scheduler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 10259
  egress:
    - ports:
        - protocol: TCP
          port: 443

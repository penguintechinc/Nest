apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-scheduler
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-scheduler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 10259
  egress:
    # Arbitrary external HTTPS egress (license.penguintech.io). Destination
    # IPs are not stable enough to enumerate; restricted to port 443 only.
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server access (scheduler extender/webhook calls).
    - ports:
        - protocol: TCP
          port: 6443

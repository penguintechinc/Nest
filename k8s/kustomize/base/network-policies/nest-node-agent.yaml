apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-node-agent
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-node-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Arbitrary external HTTPS egress (license.penguintech.io, hardware
    # inventory/DarkDrive reporting endpoints). Destination IPs are not
    # stable enough to enumerate; restricted to port 443 only.
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server access (HardwareInventory/DarkDrive CR updates).
    - ports:
        - protocol: TCP
          port: 6443

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-gateway
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-api
      ports:
        - protocol: TCP
          port: 50051
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # nest-gateway proxies to per-tenant, customer-supplied cloud storage
    # endpoints (DO/Vultr/Linode/S3-compat providers) whose IPs cannot be
    # enumerated in advance. Explicit ipBlock (rather than an implicit
    # unrestricted rule) restricted to port 443 only — genuinely required.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

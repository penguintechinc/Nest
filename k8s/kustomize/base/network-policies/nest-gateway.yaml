apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nest-gateway
  namespace: nest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nest-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nest-api
      ports:
        - protocol: TCP
          port: 50051
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

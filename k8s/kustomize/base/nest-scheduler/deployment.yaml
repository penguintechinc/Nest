apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-scheduler
  labels:
    app: nest-scheduler
    app.kubernetes.io/name: nest-scheduler
    app.kubernetes.io/part-of: nest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-scheduler
  template:
    metadata:
      labels:
        app: nest-scheduler
        app.kubernetes.io/name: nest-scheduler
        app.kubernetes.io/part-of: nest
    spec:
      serviceAccountName: nest-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: nest-scheduler
        image: ghcr.io/penguintechinc/nest/nest-scheduler:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9092
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: "warn"
        - name: METRICS_ADDR
          value: ":9092"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-scheduler
  labels:
    app: nest-scheduler
    app.kubernetes.io/part-of: nest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nest-scheduler
  labels:
    app.kubernetes.io/part-of: nest
rules:
- apiGroups: ["nest.penguintech.io"]
  resources: ["dataresources", "dataresourceclasses", "hardwareinventories"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["nest.penguintech.io"]
  resources: ["dataresources/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nest-scheduler
  labels:
    app.kubernetes.io/part-of: nest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nest-scheduler
subjects:
- kind: ServiceAccount
  name: nest-scheduler
  namespace: nest

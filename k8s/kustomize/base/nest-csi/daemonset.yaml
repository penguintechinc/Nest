apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nest-csi-node
  namespace: nest
  labels:
    app: nest-csi
    app.kubernetes.io/name: nest-csi
    app.kubernetes.io/part-of: nest
spec:
  selector:
    matchLabels:
      app: nest-csi-node
  template:
    metadata:
      labels:
        app: nest-csi-node
        app.kubernetes.io/name: nest-csi
        app.kubernetes.io/part-of: nest
    spec:
      serviceAccountName: nest-csi
      hostNetwork: false
      hostPID: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
      - name: nest-csi-node
        image: ghcr.io/penguintechinc/nest/nest-csi:latest
        imagePullPolicy: IfNotPresent
        # securityContext exception (approved): CSI node plugin requires privileged
        # access for device management and host bind-mount/unmount socket access.
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          runAsUser: 0
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: LOG_LEVEL
          value: "warn"
        ports:
        - name: metrics
          containerPort: 9092
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: csi-plugin-dir
          mountPath: /var/lib/kubelet/plugins/csi.nest.penguintech.io
        - name: csi-registration-dir
          mountPath: /var/lib/kubelet/plugins_registry
        # /dev, /sys: securityContext exception (approved) — CSI node plugin needs
        # host device visibility for future block-device staging. NodeStageVolume/
        # NodePublishVolume are currently unimplemented (P2 feature, see
        # services/csi/driver/driver.go), so these are mounted read-only for now;
        # revisit (drop readOnly on host-dev only, if mkfs/format needs write) once
        # that implementation lands.
        - name: host-dev
          mountPath: /dev
          readOnly: true
        - name: host-sys
          mountPath: /sys
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: csi-plugin-dir
        hostPath:
          path: /var/lib/kubelet/plugins/csi.nest.penguintech.io
          type: DirectoryOrCreate
      # csi-plugin-socket-dir (the entire /var/lib/kubelet/plugins tree, covering
      # every other CSI driver's socket/state on the node) was removed: the CSI
      # endpoint (services/csi/main.go default: unix:///var/lib/kubelet/plugins/
      # csi.nest.penguintech.io/csi.sock) only ever lives under csi-plugin-dir
      # above; the broader mount was unused and unnecessarily overprivileged.
      - name: csi-registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      - name: host-sys
        hostPath:
          path: /sys
          type: Directory
      - name: tmp
        emptyDir: {}
      tolerations:
      - operator: Exists
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-csi
  namespace: nest
  labels:
    app: nest-csi
    app.kubernetes.io/part-of: nest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nest-csi-node
  labels:
    app.kubernetes.io/part-of: nest
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nest-csi-node
  labels:
    app.kubernetes.io/part-of: nest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nest-csi-node
subjects:
- kind: ServiceAccount
  name: nest-csi
  namespace: nest

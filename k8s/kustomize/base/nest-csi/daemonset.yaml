apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nest-csi-node
  labels:
    app: nest-csi
    app.kubernetes.io/name: nest-csi
    app.kubernetes.io/part-of: nest
spec:
  selector:
    matchLabels:
      app: nest-csi-node
  template:
    metadata:
      labels:
        app: nest-csi-node
        app.kubernetes.io/name: nest-csi
        app.kubernetes.io/part-of: nest
    spec:
      serviceAccountName: nest-csi
      hostNetwork: false
      hostPID: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
      - name: nest-csi-node
        image: ghcr.io/penguintechinc/nest/nest-csi:latest
        imagePullPolicy: IfNotPresent
        # ROOT EXCEPTION (approved): CSI plugin requires privileged access for device management and socket access
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          runAsUser: 0
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: LOG_LEVEL
          value: "warn"
        ports:
        - name: metrics
          containerPort: 9092
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: csi-plugin-dir
          mountPath: /var/lib/kubelet/plugins/csi.nest.penguintech.io
        - name: csi-plugin-socket-dir
          mountPath: /var/lib/kubelet/plugins
        - name: csi-registration-dir
          mountPath: /var/lib/kubelet/plugins_registry
        - name: host-dev
          mountPath: /dev
        - name: host-sys
          mountPath: /sys
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: csi-plugin-dir
        hostPath:
          path: /var/lib/kubelet/plugins/csi.nest.penguintech.io
          type: DirectoryOrCreate
      - name: csi-plugin-socket-dir
        hostPath:
          path: /var/lib/kubelet/plugins
          type: Directory
      - name: csi-registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      - name: host-sys
        hostPath:
          path: /sys
          type: Directory
      - name: tmp
        emptyDir: {}
      tolerations:
      - operator: Exists
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-csi
  labels:
    app: nest-csi
    app.kubernetes.io/part-of: nest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nest-csi-node
  labels:
    app.kubernetes.io/part-of: nest
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nest-csi-node
  labels:
    app.kubernetes.io/part-of: nest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nest-csi-node
subjects:
- kind: ServiceAccount
  name: nest-csi
  namespace: nest

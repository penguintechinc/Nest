# Velero BackupStorageLocation pointing to the Nest-managed Ceph RGW (S3-compatible).
# Backups land in a dedicated nest-backups bucket in the local RGW cluster.
# See spec §16.3 — backups always written to an object DataResource.
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: nest-default
  namespace: velero
  labels:
    app.kubernetes.io/part-of: nest
spec:
  provider: aws
  objectStorage:
    bucket: nest-velero-backups
    prefix: ""
  config:
    region: us-east-1
    s3ForcePathStyle: "true"
    s3Url: https://rook-ceph-rgw-nest-rgw.rook-ceph.svc.cluster.local
    insecureSkipTLSVerify: "false"
  credential:
    name: nest-velero-credentials
    key: cloud
#
# NOTE: the `nest-velero-credentials` Secret referenced above is intentionally
# NOT defined here. Real Ceph RGW S3 credentials must never be committed to
# source control. Provision this Secret out-of-band before deploying Velero,
# via one of:
#   - Sealed Secrets:            kubeseal < velero-credentials.yaml > sealed-velero-credentials.yaml
#   - External Secrets Operator: an ExternalSecret CR pulling from Vault/skauswatch
# Expected shape (namespace: velero, key: "cloud"):
#   [default]
#   aws_access_key_id=<RGW user access key>
#   aws_secret_access_key=<RGW user secret key>

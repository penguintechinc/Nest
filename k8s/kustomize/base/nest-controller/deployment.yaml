apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-controller
  namespace: nest
  labels:
    app: nest-controller
    app.kubernetes.io/name: nest-controller
    app.kubernetes.io/part-of: nest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-controller
  template:
    metadata:
      labels:
        app: nest-controller
        app.kubernetes.io/name: nest-controller
        app.kubernetes.io/part-of: nest
    spec:
      serviceAccountName: nest-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: nest-controller
        image: ghcr.io/penguintechinc/nest/nest-controller:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: GIN_MODE
          value: "release"
        - name: PORT
          value: "8081"
        - name: METRICS_ADDR
          value: ":9090"
        - name: LOG_LEVEL
          value: "warn"
        - name: LEADER_ELECTION_ENABLED
          value: "true"
        - name: LEADER_ELECTION_NAMESPACE
          value: "nest"
        - name: LEADER_ELECTION_ID
          value: "nest-controller-leader"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-controller
  namespace: nest
  labels:
    app: nest-controller
    app.kubernetes.io/part-of: nest
# ClusterRole + ClusterRoleBinding for this ServiceAccount are defined in
# rbac-dblb.yaml (least-privilege, derived from actual reconciler client
# calls — see comments there). Keeping RBAC in one file avoids the drift risk
# of a wildcard grant living alongside a narrowly-scoped one for the same SA.

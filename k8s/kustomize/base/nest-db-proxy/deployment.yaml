apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-db-proxy
  namespace: nest
  labels:
    app: nest-db-proxy
    component: database-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-db-proxy
  template:
    metadata:
      labels:
        app: nest-db-proxy
        component: database-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: nest-db-proxy
      containers:
        - name: db-proxy
          # nest-built, in-repo DB Proxy (services/db-proxy). Alpha/beta may use a
          # mutable tag; production overlays MUST pin to an @sha256 digest.
          image: ghcr.io/penguintechinc/nest/db-proxy:latest
          imagePullPolicy: IfNotPresent
          env:
            # --- Redis config bus (routes/security/cache; see CONFIG_CONTRACT.md) ---
            - name: DBPROXY_REDIS_ADDR
              value: nest-valkey
            - name: DBPROXY_REDIS_PORT
              value: "6379"
            - name: DBPROXY_REDIS_DB
              value: "0"
            - name: DBPROXY_REDIS_PREFIX
              value: "nest:dbproxy"
            # --- Listeners: mysql=BASE+0, postgresql=BASE+1, redis=BASE+2 ---
            - name: DBPROXY_LISTEN_ADDR
              value: 0.0.0.0
            - name: DBPROXY_LISTEN_PORT
              value: "5432"
            # --- gRPC ConfigService (manager control plane) ---
            - name: DBPROXY_GRPC_ADDR
              value: 0.0.0.0
            - name: DBPROXY_GRPC_PORT
              value: "50051"
            # --- Metrics / health ---
            - name: DBPROXY_METRICS_ADDR
              value: 0.0.0.0:9090
            - name: DBPROXY_METRICS_PORT
              value: "9090"
            # --- Query result cache (intent #4) ---
            - name: DBPROXY_CACHE_ENABLED
              value: "true"
            - name: DBPROXY_CACHE_TTL_SECS
              value: "30"
            # --- Performance toggle: XDP/AF_XDP off by default so the pod runs
            # rootless with no NET_ADMIN. Flip to "true" (and grant NET_ADMIN via
            # a performance overlay) only where kernel/privileges allow. ---
            - name: DBPROXY_XDP_ENABLED
              value: "false"
          ports:
            - name: mysql
              containerPort: 5432
              protocol: TCP
            - name: postgres
              containerPort: 5433
              protocol: TCP
            - name: redis
              containerPort: 5434
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - nest-db-proxy
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: nest-db-proxy
  namespace: nest
  labels:
    app: nest-db-proxy
    component: database-proxy
spec:
  type: ClusterIP
  selector:
    app: nest-db-proxy
  ports:
    # Client-facing standard ports mapped onto the proxy's per-protocol listeners.
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-db-proxy
  namespace: nest
  labels:
    app: nest-db-proxy

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-api
  namespace: nest
  labels:
    app: nest-api
    app.kubernetes.io/name: nest-api
    app.kubernetes.io/part-of: nest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-api
  template:
    metadata:
      labels:
        app: nest-api
        app.kubernetes.io/name: nest-api
        app.kubernetes.io/part-of: nest
    spec:
      serviceAccountName: nest-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: nest-api
        image: ghcr.io/penguintechinc/nest/nest-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        env:
        - name: GIN_MODE
          value: "release"
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "warn"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-api
  namespace: nest
  labels:
    app: nest-api
    app.kubernetes.io/part-of: nest

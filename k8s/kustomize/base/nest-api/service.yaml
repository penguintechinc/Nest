apiVersion: v1
kind: Service
metadata:
  name: nest-api
  labels:
    app: nest-api
    app.kubernetes.io/name: nest-api
    app.kubernetes.io/part-of: nest
spec:
  type: ClusterIP
  selector:
    app: nest-api
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhooksubscriptions.nest.penguintech.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: nest.penguintech.io
  names:
    kind: WebhookSubscription
    listKind: WebhookSubscriptionList
    plural: webhooksubscriptions
    singular: webhooksubscription
    shortNames: [wsub]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [url, tenant, events]
            properties:
              url:
                type: string
                description: "Webhook delivery endpoint"
              tenant:
                type: string
                description: "Owning tenant"
              events:
                type: array
                items:
                  type: string
                description: "Subscribed event types"
              secretRef:
                type: string
                description: "References HMAC signing key secret"
          status:
            type: object
            properties:
              lastDeliveredAt:
                type: string
                format: date-time
                description: "When last webhook was successfully delivered"
              failureCount:
                type: integer
                format: int32
                description: "Consecutive delivery failures"
              state:
                type: string
                enum: [active, suspended]

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dataresources.nest.penguintech.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: nest.penguintech.io
  names:
    kind: DataResource
    listKind: DataResourceList
    plural: dataresources
    singular: dataresource
    shortNames: [dr]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Type
      type: string
      jsonPath: .spec.type
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [type, class, tenant]
            properties:
              type:
                type: string
                description: "Resource type: postgres, object, pvc/block, pvc/file, keyvalue, etc."
              class:
                type: string
                description: "References a DataResourceClass name"
              tenant:
                type: string
                description: "Tenant ID (mandatory)"
              protocols:
                type: array
                items:
                  type: string
                  enum: [native, grpc, rest]
                description: "Enabled access protocols"
              size:
                type: object
                properties:
                  storage:
                    type: string
                    description: "Storage capacity (e.g. 200Gi)"
                  iops:
                    type: integer
                    format: int64
                    description: "IOPS target"
              tls:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [required, preferred, disabled]
                    default: required
                  minVersion:
                    type: string
                    default: "1.3"
                  clientAuth:
                    type: string
                    enum: [none, optional, required]
                  certSource:
                    type: string
                    enum: [nest-ca, cert-manager, byo]
              secretsBackend:
                type: object
                required: [kind]
                properties:
                  kind:
                    type: string
                    enum: [nest-envelope, vault, infisical, aws-sm, gcp-sm, azure-kv, bitwarden]
                  ref:
                    type: string
              dataProtectionPolicy:
                type: string
                description: "References a DataProtectionPolicy"
              annotations:
                type: object
                additionalProperties:
                  type: string
              origination:
                type: string
                enum: [managed, imported, external]
                default: managed
              ha:
                type: boolean
              replicas:
                type: object
                properties:
                  write:
                    type: object
                    properties:
                      min:
                        type: integer
                        format: int32
                      max:
                        type: integer
                        format: int32
                      default:
                        type: integer
                        format: int32
                      count:
                        type: integer
                        format: int32
                  read:
                    type: object
                    properties:
                      min:
                        type: integer
                        format: int32
                      max:
                        type: integer
                        format: int32
                      default:
                        type: integer
                        format: int32
                      count:
                        type: integer
                        format: int32
              import:
                type: object
                properties:
                  connectionString:
                    type: string
                  tlsMode:
                    type: string
                    default: verify-full
                  credentialSecret:
                    type: string
                  managedCredentials:
                    type: boolean
                  managedFailover:
                    type: boolean
              external:
                type: object
                required: [provider]
                properties:
                  provider:
                    type: string
                  region:
                    type: string
                  resourceId:
                    type: string
                  credentialSecret:
                    type: string
                  costTagKey:
                    type: string
                  endpoint:
                    type: string
                  engineType:
                    type: string
          status:
            type: object
            properties:
              phase:
                type: string
                enum: [Unknown, Pending, Provisioning, Ready, Degraded, Failed, Deleting]
              conditions:
                type: array
                items:
                  type: object
              endpoints:
                type: object
                properties:
                  native:
                    type: string
                  grpc:
                    type: string
                  rest:
                    type: string
              health:
                type: object
                properties:
                  state:
                    type: string
                    enum: [healthy, degraded, down]
                  message:
                    type: string
              currentOperation:
                type: string
              provisionedAt:
                type: string
                format: date-time

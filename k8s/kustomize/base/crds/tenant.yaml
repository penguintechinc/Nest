apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.nest.penguintech.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: nest.penguintech.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
    shortNames: [nt]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [displayName]
            properties:
              displayName:
                type: string
                description: "Human-readable tenant name"
              quota:
                type: object
                properties:
                  maxDataResources:
                    type: integer
                    format: int32
                    description: "Max number of DataResources (free tier: 5)"
                  maxOperatorAccounts:
                    type: integer
                    format: int32
                    description: "Max operator accounts (free tier: 3)"
                  maxResourceAccounts:
                    type: integer
                    format: int32
                    description: "Max data-resource credentials (free tier: 3)"
                  maxStorageBytes:
                    type: integer
                    format: int64
                    description: "Capacity quota"
                  maxMonthlyTokens:
                    type: integer
                    format: int64
                    description: "NestToken budget"
              defaultSecretsBackend:
                type: string
                default: nest-envelope
                description: "Default secrets backend for new resources"
              encryptionKekRef:
                type: string
                description: "References the tenant's key encryption key"
              configSource:
                type: string
                default: api
                enum: [api, gitops]
              licenseTier:
                type: string
                default: free
                enum: [free, pro, enterprise]
          status:
            type: object
            properties:
              dataResourceCount:
                type: integer
                format: int32
                description: "Current provisioned count"
              operatorAccountCount:
                type: integer
                format: int32
                description: "Current operator accounts"
              resourceAccountCount:
                type: integer
                format: int32
                description: "Current data-resource credentials"
              conditions:
                type: array
                items:
                  type: object

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hardwareinventories.nest.penguintech.io
spec:
  group: nest.penguintech.io
  names:
    kind: HardwareInventory
    listKind: HardwareInventoryList
    plural: hardwareinventories
    singular: hardwareinventory
    shortNames: [hwi]
  scope: Cluster
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Node
      type: string
      jsonPath: .spec.node
    - name: Drives
      type: integer
      jsonPath: .status.driveCount
    - name: Dark
      type: integer
      jsonPath: .status.darkDriveCount
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [node]
            properties:
              node:
                type: string
              devices:
                type: array
                items:
                  type: object
                  required: [name, serial, model, capacityBytes, class, state]
                  properties:
                    name:
                      type: string
                    serial:
                      type: string
                    model:
                      type: string
                    capacityBytes:
                      type: integer
                      format: int64
                    class:
                      type: string
                      enum: [nvme-hot, ssd-warm, sata-bulk, sata-cold, tape]
                    state:
                      type: string
                      enum: [Active, System, Dark, Failed, Pending, Rejected, Decommissioned]
                    signature:
                      type: string
                    smart:
                      type: object
                      properties:
                        health:
                          type: string
                        wearPercent:
                          type: integer
                        hoursOn:
                          type: integer
                          format: int64
                        temperatureCelsius:
                          type: integer
                        reallocatedSectors:
                          type: integer
                          format: int64
                    firmwareVersion:
                      type: string
                    attestationMode:
                      type: string
                      enum: [tpm, aws-imds, gcp-shielded, azure-maa, unattested]
          status:
            type: object
            properties:
              driveCount:
                type: integer
              darkDriveCount:
                type: integer
              lastScanTime:
                type: string
                format: date-time
              conditions:
                type: array
                items:
                  type: object
                  required: [type, status]
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string

# DataProtectionPolicy CRD — attaches snapshot/backup/pitr policy to any DataResource.
# See Nest spec §16.1 and §11.14.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dataprotectionpolicies.nest.penguintech.io
  labels:
    app.kubernetes.io/part-of: nest
spec:
  group: nest.penguintech.io
  names:
    kind: DataProtectionPolicy
    listKind: DataProtectionPolicyList
    plural: dataprotectionpolicies
    singular: dataprotectionpolicy
    shortNames: ["dpp"]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              properties:
                snapshots:
                  type: object
                  properties:
                    schedule:
                      type: string
                      description: "Cron schedule for snapshots (e.g. @every 1h)"
                    retention:
                      type: object
                      properties:
                        hourly:  { type: integer }
                        daily:   { type: integer }
                        weekly:  { type: integer }
                        monthly: { type: integer }
                backups:
                  type: object
                  properties:
                    schedule:
                      type: string
                    destination:
                      type: object
                      properties:
                        kind:     { type: string }
                        resource: { type: string }
                        region:   { type: string }
                    retention:
                      type: object
                      properties:
                        daily:   { type: integer }
                        monthly: { type: integer }
                        yearly:  { type: integer }
                    encryption:
                      type: string
                      enum: ["tenantKms", "aes256", "none"]
                      default: "tenantKms"
                pitr:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    windowDays:
                      type: integer
                      minimum: 1
                      maximum: 365
                verify:
                  type: object
                  properties:
                    restoreTest:
                      type: object
                      properties:
                        schedule: { type: string }
                        target:   { type: string }
            status:
              type: object
              properties:
                lastSnapshotTime:  { type: string, format: date-time }
                lastBackupTime:    { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string }
                      message:            { type: string }
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.snapshots.schedule
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

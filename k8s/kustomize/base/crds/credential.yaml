apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: credentials.nest.penguintech.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: nest.penguintech.io
  names:
    kind: Credential
    listKind: CredentialList
    plural: credentials
    singular: credential
    shortNames: [cred]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [resource, tenant, type]
            properties:
              resource:
                type: string
                description: "References the parent DataResource"
              tenant:
                type: string
                description: "Owning tenant"
              type:
                type: string
                description: "Credential type: db-user, s3-key, redis-acl, kafka-sasl"
              username:
                type: string
                description: "Username for DB/Redis credentials"
              secretRef:
                type: string
                description: "Opaque backend reference (never store plaintext)"
              rotationPolicy:
                type: object
                properties:
                  intervalDays:
                    type: integer
                    format: int32
                    description: "Days between rotations"
                  notifyDaysBefore:
                    type: integer
                    format: int32
                    description: "Notify before rotation"
          status:
            type: object
            properties:
              lastRotatedAt:
                type: string
                format: date-time
                description: "When credential was last rotated"
              expiresAt:
                type: string
                format: date-time
                description: "When credential expires"
              state:
                type: string
                enum: [active, rotating, revoked]

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: operations.nest.penguintech.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: nest.penguintech.io
  names:
    kind: Operation
    listKind: OperationList
    plural: operations
    singular: operation
    shortNames: [op]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [tenant, operationType]
            properties:
              tenant:
                type: string
                description: "Owning tenant"
              operationType:
                type: string
                description: "Operation kind"
              resourceRef:
                type: string
                description: "References target DataResource"
              parameters:
                type: string
                description: "Opaque JSON blob for operation-specific params"
          status:
            type: object
            properties:
              phase:
                type: string
                enum: [Pending, Running, Succeeded, Failed, Cancelled]
              startedAt:
                type: string
                format: date-time
              finishedAt:
                type: string
                format: date-time
              message:
                type: string
              result:
                type: string
              conditions:
                type: array
                items:
                  type: object

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: schemas.nest.penguintech.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: nest.penguintech.io
  names:
    kind: Schema
    listKind: SchemaList
    plural: schemas
    singular: schema
    shortNames: [nsch]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [resource]
            properties:
              resource:
                type: string
                description: "References the parent DataResource"
              dialect:
                type: string
                enum: [nest, passthrough]
                default: nest
              version:
                type: integer
                format: int64
                description: "Monotonic schema version (server-assigned)"
              enforcement:
                type: string
                enum: [strict, advisory, "off"]
                default: advisory
              validateWrites:
                type: boolean
                description: "Enable write-time schema enforcement at the DB Proxy"
              fields:
                type: array
                items:
                  type: object
                  required: [name, type]
                  properties:
                    name:
                      type: string
                      description: "Field/column name"
                    type:
                      type: string
                      description: "Nest engine-agnostic type"
                    required:
                      type: boolean
                      description: "NOT NULL constraint"
                    primaryKey:
                      type: boolean
                      description: "Primary key flag"
                    default:
                      type: string
                      description: "Default value expression"
                    constraints:
                      type: array
                      items:
                        type: object
                        required: [type]
                        properties:
                          type:
                            type: string
                            description: "Constraint type: gte, lte, maxLen, format, enum"
                          value:
                            type: string
                            description: "Constraint value"
                    labels:
                      type: array
                      items:
                        type: string
                      description: "Indexer labels (e.g. pii.email)"
              indexes:
                type: array
                items:
                  type: object
                  required: [name, fields]
                  properties:
                    name:
                      type: string
                    fields:
                      type: array
                      items:
                        type: string
                    unique:
                      type: boolean
          status:
            type: object
            properties:
              appliedVersion:
                type: integer
                format: int64
                description: "Currently applied version"
              targetVersion:
                type: integer
                format: int64
                description: "Desired version"
              drift:
                type: string
                enum: [none, detected]
              conditions:
                type: array
                items:
                  type: object

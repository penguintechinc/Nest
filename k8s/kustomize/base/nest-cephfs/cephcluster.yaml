apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
  labels:
    app.kubernetes.io/part-of: nest
  annotations:
    nest.penguintech.io/encryption: "transit=msgr2,rest=none"
    nest.penguintech.io/tls-required: "true"
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.0
  dataDirHostPath: /var/lib/rook
  dashboard:
    enabled: true
    ssl: true
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    modules:
      - name: pg_autoscaler
        enabled: true
  storage:
    useAllNodes: false
    useAllDevices: false
    onlyApplyOSDPlacement: true
    nodes: []  # populated via DarkDrive adoption; seed at deploy time via kustomize patch
  placement:
    osd:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: nest.penguintech.io/role
                  operator: In
                  values:
                    - storage
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
    mon:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: nest.penguintech.io/role
                  operator: In
                  values:
                    - storage
    mgr:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: nest.penguintech.io/role
                  operator: In
                  values:
                    - storage
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
  security:
    kms:
      connectionDetails:
        KMS_PROVIDER: skauswatch
        KMS_ENDPOINT: http://skauswatch:8080
  network:
    connections:
      encryption:
        enabled: true
      compression:
        enabled: false
      requireMsgr2: true

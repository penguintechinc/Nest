# CephFS StorageClass for ReadWriteMany shared filesystem DataResources
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs
  labels:
    app.kubernetes.io/part-of: nest
provisioner: rook-ceph.rook.io/cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: nest-cephfs
  pool: nest-cephfs-data0
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Delete
allowVolumeExpansion: true
mountOptions:
  - discard
---
# CephFS StorageClass for ReadWriteOnce (single mount) filesystem DataResources
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs-rwo
  labels:
    app.kubernetes.io/part-of: nest
provisioner: rook-ceph.rook.io/cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: nest-cephfs
  pool: nest-cephfs-data0
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Delete
allowVolumeExpansion: true

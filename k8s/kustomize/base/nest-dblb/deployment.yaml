apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-dblb
  namespace: nest
  labels:
    app: nest-dblb
    component: database-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-dblb
  template:
    metadata:
      labels:
        app: nest-dblb
        component: database-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: nest-dblb
      containers:
      - name: dblb
        image: ghcr.io/penguintechinc/marchproxy/dblb:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: DBLB_CONFIG
          value: /etc/dblb/dblb.conf
        - name: DBLB_PORT
          value: "5432"
        - name: DBLB_METRICS_PORT
          value: "9090"
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        volumeMounts:
        - name: dblb-config
          mountPath: /etc/dblb
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: dblb-config
        configMap:
          name: nest-dblb-config
          defaultMode: 0444
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - nest-dblb
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: nest-dblb
  namespace: nest
  labels:
    app: nest-dblb
    component: database-proxy
spec:
  type: ClusterIP
  selector:
    app: nest-dblb
  ports:
  - name: postgres-proxy
    port: 5432
    targetPort: postgres
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-dblb
  namespace: nest
  labels:
    app: nest-dblb

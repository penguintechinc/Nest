apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nest

resources:
- deployment.yaml

commonLabels:
  app.kubernetes.io/name: nest-dblb
  app.kubernetes.io/component: database-proxy
  app.kubernetes.io/part-of: nest

configMapGenerator:
- name: nest-dblb-config
  files:
  - dblb.conf
  options:
    disableNameSuffixHash: true

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nest-node-agent
  labels:
    app: nest-node-agent
    app.kubernetes.io/part-of: nest
rules:
- apiGroups: ["nest.penguintech.io"]
  resources: ["hardwareinventories", "darkdrives"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["nest.penguintech.io"]
  resources: ["hardwareinventories/status", "darkdrives/status"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nest-node-agent
  labels:
    app: nest-node-agent
    app.kubernetes.io/part-of: nest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nest-node-agent
subjects:
- kind: ServiceAccount
  name: nest-node-agent
  namespace: nest

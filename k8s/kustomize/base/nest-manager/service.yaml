apiVersion: v1
kind: Service
metadata:
  name: nest-manager
  namespace: nest
  labels:
    app: nest-manager
    app.kubernetes.io/name: nest-manager
    app.kubernetes.io/part-of: nest
spec:
  type: ClusterIP
  selector:
    app: nest-manager
  ports:
  - name: http
    port: 8081
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 50052
    targetPort: grpc
    protocol: TCP

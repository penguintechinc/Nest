apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-manager
  namespace: nest
  labels:
    app: nest-manager
    app.kubernetes.io/name: nest-manager
    app.kubernetes.io/part-of: nest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-manager
  template:
    metadata:
      labels:
        app: nest-manager
        app.kubernetes.io/name: nest-manager
        app.kubernetes.io/part-of: nest
    spec:
      serviceAccountName: nest-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: nest-manager
        image: ghcr.io/penguintechinc/nest/nest-manager:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        - name: grpc
          containerPort: 50052
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: info
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nest-manager
  namespace: nest
  labels:
    app: nest-manager
    app.kubernetes.io/part-of: nest

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nest
  namespace: nest
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - "nest.penguintech.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: nest-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nest-gateway
          port: 8082

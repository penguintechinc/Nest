# Scoped allow rules for the rook-ceph namespace (mons/mgrs/OSDs/MDS/RGW).
# Ceph daemons must talk to each other freely within the namespace; only
# specific external consumers (Nest CSI plugins, Nest apps needing S3) are
# allowed in from the `nest` namespace, plus DNS/API-server egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: rook-ceph
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# Nest CSI controller/node plugins and DBLB/apps consuming RBD/CephFS/RGW
# need to reach Ceph mons, OSDs, MDS and RGW from the `nest` namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nest-namespace-clients
  namespace: rook-ceph
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nest
---
# Ceph daemons and the Rook operator need DNS resolution and API server access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-apiserver-egress
  namespace: rook-ceph
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 6443

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-api
spec:
  template:
    spec:
      containers:
      - name: nest-api
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-gateway
spec:
  template:
    spec:
      containers:
      - name: nest-gateway
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-scheduler
spec:
  template:
    spec:
      containers:
      - name: nest-scheduler
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-controller
spec:
  template:
    spec:
      containers:
      - name: nest-controller
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: LEADER_ELECTION_ENABLED
          value: "false"
        - name: LOG_LEVEL
          value: "debug"

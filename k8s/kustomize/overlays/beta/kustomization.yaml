apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer here — see overlays/alpha/kustomization.yaml.
resources:
  - ../../base
images:
  - name: ghcr.io/penguintechinc/nest/nest-api
    newTag: beta-latest
  - name: ghcr.io/penguintechinc/nest/nest-controller
    newTag: beta-latest
  - name: ghcr.io/penguintechinc/nest/nest-node-agent
    newTag: beta-latest
  - name: ghcr.io/penguintechinc/nest/nest-csi
    newTag: beta-latest
  - name: ghcr.io/penguintechinc/nest/nest-scheduler
    newTag: beta-latest
patches:
  - target:
      kind: Deployment
      name: nest-api
    path: patches/nest-api.yaml
  - target:
      kind: Deployment
      name: nest-controller
    path: patches/nest-controller.yaml

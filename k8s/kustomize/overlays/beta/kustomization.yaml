apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nest-beta
namePrefix: beta-
commonLabels:
  environment: beta
resources:
  - ../../base
replicas:
  - name: beta-manager
    count: 2
images:
  - name: nest-manager
    newName: registry-dal2.penguintech.cloud/nest/nest-manager
    newTag: latest
configMapGenerator:
  - name: nest-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - RELEASE_MODE=false

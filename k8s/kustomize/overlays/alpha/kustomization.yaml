apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer here — the base already scopes nest-owned
# resources to `nest` and Rook-Ceph/Velero resources to their own
# namespaces. Re-adding it here would sweep everything into `nest` again.
resources:
  - ../../base
images:
  - name: ghcr.io/penguintechinc/nest/nest-api
    newName: localhost:32000/nest-api
    newTag: latest
  - name: ghcr.io/penguintechinc/nest/nest-controller
    newName: localhost:32000/nest-controller
    newTag: latest
  - name: ghcr.io/penguintechinc/nest/nest-node-agent
    newName: localhost:32000/nest-node-agent
    newTag: latest
  - name: ghcr.io/penguintechinc/nest/nest-csi
    newName: localhost:32000/nest-csi
    newTag: latest
  - name: ghcr.io/penguintechinc/nest/nest-scheduler
    newName: localhost:32000/nest-scheduler
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: nest-api
    path: patches/nest-api.yaml
  - target:
      kind: Deployment
      name: nest-controller
    path: patches/nest-controller.yaml

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nest-alerts
  namespace: nest
  labels:
    release: nest-prometheus
spec:
  groups:
    - name: nest.api
      rules:
        - alert: NestAPIHighLatency
          expr: histogram_quantile(0.99, sum(rate(nest_api_request_duration_seconds_bucket[5m])) by (le, path)) > 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Nest API p99 latency > 1s"
            description: "Path {{ $labels.path }} p99 latency is {{ $value }}s"
            runbook: "https://docs.penguintech.io/nest/runbooks/api-latency"

        - alert: NestAPIHighErrorRate
          expr: sum(rate(nest_api_requests_total{status=~"5.."}[5m])) / sum(rate(nest_api_requests_total[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Nest API error rate > 1%"
            description: "Error rate is {{ $value | humanizePercentage }}"

        - alert: NestAPIWarnErrorRate
          expr: sum(rate(nest_api_requests_total{status=~"5.."}[5m])) / sum(rate(nest_api_requests_total[5m])) > 0.001
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Nest API error rate > 0.1%"

    - name: nest.storage
      rules:
        - alert: NestPVCUsageCritical
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PVC usage > 90%"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is {{ $value }}% full"

        - alert: NestPVCUsageWarning
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC usage > 70%"

    - name: nest.replication
      rules:
        - alert: NestReplicationLagHigh
          expr: nest_replication_lag_seconds > 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Replication lag > 10s"
            description: "Resource {{ $labels.resource }} replication lag is {{ $value }}s"

    - name: nest.pods
      rules:
        - alert: NestPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="nest"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod crash-looping in nest namespace"
            description: "Pod {{ $labels.pod }} container {{ $labels.container }} is crash-looping"

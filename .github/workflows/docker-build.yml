name: Build and Push Docker Images (Nest Go Services)

on:
  push:
    branches:
      - main
      - 'v*.x'
      - 'release/v*.x'
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Determine version tag based on ref
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Calculate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            VERSION="gamma-$(date +%s)"
          elif [[ "${{ github.ref }}" =~ refs/heads/(v|release/v) ]]; then
            VERSION="beta-$(date +%s)"
          else
            VERSION="alpha-$(date +%s)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

  # Build matrix for Nest Go services × platforms (parallel per-arch builds)
  build-platform:
    needs: determine-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # nest-controller
          - service: controller
            dockerfile: services/k8s-controller/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
          - service: controller
            dockerfile: services/k8s-controller/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
          # nest-scheduler
          - service: scheduler
            dockerfile: services/scheduler/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
          - service: scheduler
            dockerfile: services/scheduler/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
          # nest-gateway
          - service: gateway
            dockerfile: services/gateway/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
          - service: gateway
            dockerfile: services/gateway/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
          # nest-api
          - service: api
            dockerfile: apps/api/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
          - service: api
            dockerfile: apps/api/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
          # nest-node-agent
          - service: node-agent
            dockerfile: services/node-agent/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
          - service: node-agent
            dockerfile: services/node-agent/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
          # nest-csi
          - service: csi
            dockerfile: services/csi/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
          - service: csi
            dockerfile: services/csi/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
          # nest-nfs-gateway
          - service: nfs-gateway
            dockerfile: services/nfs-gateway/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
          - service: nfs-gateway
            dockerfile: services/nfs-gateway/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64
          # nest-iscsi-gateway
          - service: iscsi-gateway
            dockerfile: services/iscsi-gateway/Dockerfile
            platform: linux/amd64
            arch_suffix: amd64
          - service: iscsi-gateway
            dockerfile: services/iscsi-gateway/Dockerfile
            platform: linux/arm64
            arch_suffix: arm64

    permissions:
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (nest-${{ matrix.service }}-${{ matrix.arch_suffix }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/nest-${{ matrix.service }}:${{ needs.determine-version.outputs.VERSION }}-${{ matrix.arch_suffix }}
          labels: |
            org.opencontainers.image.title=nest-${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.determine-version.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cache-from: type=gha,scope=nest-${{ matrix.service }}-${{ matrix.arch_suffix }}
          cache-to: type=gha,mode=max,scope=nest-${{ matrix.service }}-${{ matrix.arch_suffix }}

  # Merge platform images into multi-arch manifests (skip on PR)
  merge-manifests:
    needs: [determine-version, build-platform]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        service: [controller, scheduler, gateway, api, node-agent, csi, nfs-gateway, iscsi-gateway]

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest (nest-${{ matrix.service }})
        run: |
          VERSION="${{ needs.determine-version.outputs.VERSION }}"
          REGISTRY_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/nest-${{ matrix.service }}"
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:${VERSION}" \
            "${REGISTRY_IMAGE}:${VERSION}-amd64" \
            "${REGISTRY_IMAGE}:${VERSION}-arm64"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/nest-${{ matrix.service }}:${{ needs.determine-version.outputs.VERSION }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'

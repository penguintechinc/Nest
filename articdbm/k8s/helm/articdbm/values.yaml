# Default values for articdbm
replicaCount: 3

image:
  registry: ghcr.io
  repository: penguintechinc/articdbm
  pullPolicy: IfNotPresent
  tag: "latest"

managerImage:
  registry: ghcr.io
  repository: penguintechinc/articdbm-manager
  pullPolicy: IfNotPresent
  tag: "latest"

proxyImage:
  registry: ghcr.io
  repository: penguintechinc/articdbm-proxy
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  managerPort: 8000
  proxyMysqlPort: 3306
  proxyPostgresPort: 5432
  proxyMssqlPort: 1433
  proxyMongodbPort: 27017
  proxyRedisPort: 6380
  metricsPort: 9090

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: articdbm.penguintech.io
      paths:
        - path: /
          pathType: Prefix
          service: manager
  tls:
    - secretName: articdbm-tls
      hosts:
        - articdbm.penguintech.io

resources:
  manager:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  proxy:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - articdbm
          topologyKey: kubernetes.io/hostname

persistence:
  enabled: true
  storageClass: "longhorn"
  accessMode: ReadWriteOnce
  size: 10Gi

# PostgreSQL subchart configuration
postgresql:
  enabled: true
  auth:
    username: articdbm
    password: articdbm
    database: articdbm
  primary:
    persistence:
      enabled: true
      storageClass: "longhorn"
      size: 20Gi
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

# Redis subchart configuration
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      storageClass: "longhorn"
      size: 5Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi

# Environment variables
env:
  SESSION_SECRET: "supersecret123"
  MYSQL_ENABLED: "true"
  POSTGRESQL_ENABLED: "true"
  MSSQL_ENABLED: "true"
  MONGODB_ENABLED: "true"
  REDIS_PROXY_ENABLED: "true"
  SQL_INJECTION_DETECTION: "true"
  MAX_CONNECTIONS: "1000"

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

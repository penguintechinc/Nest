{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "articdbm.fullname" . }}
  labels:
    {{- include "articdbm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "articdbm.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 8000
      - protocol: TCP
        port: 3306
      - protocol: TCP
        port: 5432
      - protocol: TCP
        port: 1433
      - protocol: TCP
        port: 27017
      - protocol: TCP
        port: 6380
      - protocol: TCP
        port: 9090
  egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: postgresql
      ports:
      - protocol: TCP
        port: 5432
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: redis
      ports:
      - protocol: TCP
        port: 6379
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53
{{- end }}

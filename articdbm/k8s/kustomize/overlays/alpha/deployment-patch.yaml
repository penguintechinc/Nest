apiVersion: apps/v1
kind: Deployment
metadata:
  name: articdbm-manager
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
        - name: LOG_LEVEL
          value: DEBUG
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: articdbm-proxy
spec:
  template:
    spec:
      containers:
      - name: proxy
        env:
        - name: LOG_LEVEL
          value: DEBUG
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi

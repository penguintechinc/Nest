---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: articdbm-alpha

namespace: articdbm

namePrefix: alpha-

commonLabels:
  app.kubernetes.io/name: articdbm
  app.kubernetes.io/environment: alpha
  app.kubernetes.io/managed-by: kustomize

bases:
  - ../../base

replicas:
  - name: articdbm-manager
    count: 1
  - name: articdbm-proxy
    count: 1

patchesStrategicMerge:
  - deployment-patch.yaml

commonEnvVars:
  - name: LOG_LEVEL
    value: DEBUG

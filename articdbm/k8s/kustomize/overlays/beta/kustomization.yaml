---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: articdbm-beta

namespace: articdbm

namePrefix: beta-

commonLabels:
  app.kubernetes.io/name: articdbm
  app.kubernetes.io/environment: beta
  app.kubernetes.io/managed-by: kustomize

bases:
  - ../../base

replicas:
  - name: articdbm-manager
    count: 2
  - name: articdbm-proxy
    count: 2

patchesStrategicMerge:
  - deployment-patch.yaml

commonEnvVars:
  - name: LOG_LEVEL
    value: INFO

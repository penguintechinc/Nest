---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: articdbm-base

namespace: articdbm

commonLabels:
  app.kubernetes.io/name: articdbm
  app.kubernetes.io/managed-by: kustomize

resources:
  - ../../manifests/namespace.yaml
  - ../../manifests/serviceaccount.yaml
  - ../../manifests/manager/deployment.yaml
  - ../../manifests/manager/service.yaml
  - ../../manifests/proxy/deployment.yaml
  - ../../manifests/proxy/service.yaml

replicas:
  - name: articdbm-manager
    count: 3
  - name: articdbm-proxy
    count: 3

apiVersion: v1
kind: Service
metadata:
  name: articdbm-proxy
  labels:
    app.kubernetes.io/name: articdbm
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: mysql
    protocol: TCP
    name: mysql
  - port: 5432
    targetPort: postgres
    protocol: TCP
    name: postgres
  - port: 1433
    targetPort: mssql
    protocol: TCP
    name: mssql
  - port: 27017
    targetPort: mongodb
    protocol: TCP
    name: mongodb
  - port: 6380
    targetPort: redis-proxy
    protocol: TCP
    name: redis-proxy
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app.kubernetes.io/name: articdbm
    app.kubernetes.io/component: proxy

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'articdbm-proxy-1'
    static_configs:
      - targets: ['proxy-dev-1:9091']
        labels:
          node: 'primary'

  - job_name: 'articdbm-proxy-2'
    static_configs:
      - targets: ['proxy-dev-2:9092']
        labels:
          node: 'secondary'

  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy-dev:9090']

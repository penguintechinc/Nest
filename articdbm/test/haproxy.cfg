global
    maxconn 4096
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    log global

frontend mysql_front
    bind *:3306
    default_backend mysql_back

backend mysql_back
    balance roundrobin
    server proxy1 proxy-dev-1:3306 check
    server proxy2 proxy-dev-2:3306 check

frontend postgresql_front
    bind *:5432
    default_backend postgresql_back

backend postgresql_back
    balance roundrobin
    server proxy1 proxy-dev-1:5432 check
    server proxy2 proxy-dev-2:5432 check

frontend mongodb_front
    bind *:27017
    default_backend mongodb_back

backend mongodb_back
    balance roundrobin
    server proxy1 proxy-dev-1:27017 check
    server proxy2 proxy-dev-2:27017 check

frontend redis_front
    bind *:6379
    default_backend redis_back

backend redis_back
    balance roundrobin
    server proxy1 proxy-dev-1:6379 check
    server proxy2 proxy-dev-2:6379 check

frontend stats
    bind *:9090
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
